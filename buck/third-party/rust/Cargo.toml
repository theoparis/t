[package]
name = "rust-third-party"
version = "0.1.0"
edition = "2024"

[lib]
name = "dummy"
path = "dummy.rs"

[dependencies]
rootcause = { version = "0.12.1", default-features = false }
derive_more = { version = "2.1.1", default-features = false, features = [
    "display",
    "error",
    "from",
] }
reqwest = { version = "0.13.3", features = [
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "http2",
    "charset",
    "system-proxy",
    "rustls-no-provider",
], default-features = false }
rustls = { version = "0.23.40", default-features = false }
goblin = { version = "0.10.5", default-features = false, features = [
    "endian_fd",
    "alloc",
    "mach32",
    "mach64",
    "elf32",
    "elf64",
] }
linked_list_allocator = "0.10.6"
spin = "0.10.0"
plist = { version = "1.9.0", default-features = false, features = ["serde"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
tokio = { version = "1.52.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }
clap = { version = "4.6.1", features = [
    "derive",
    "std",
    "help",
], default-features = false }
hex = "0.4.3"
log = { version = "0.4.29", default-features = false }
crc32fast = { version = "1.5.0", default-features = false }
indicatif = "0.18.4"
byteorder = { version = "1.5", default-features = false }
bitflags = { version = "2.11.1", default-features = false }
libc = { version = "0.2.186", default-features = false }
xattr = "1.6.1"
rustix = { version = "1.1.4", default-features = false, features = [
    "fs",
    "std",
] }
errno = { version = "0.3.14", default-features = false }
zip = { version = "8.6.0", default-features = false, features = [
    "deflate",
] }
rayon = "1.12"
futures-util = "0.3"
unicode-normalization = { version = "0.1", default-features = false }
fatfs = "0.3"
fscommon = "0.1"
serde_bytes = "0.11"
getrandom = "0.4"
flate2 = "1.1"
hashbrown = "0.17"
memmap2 = "0.9"
binrw = { version = "0.15.1", default-features = false }
zlib-rs = { version = "0.6.3", default-features = false, features = [
    "__internal-api",
] }
rand_core = { version = "0.10.1", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
lzma-rust2 = { version = "=0.16.2", default-features = false }
lz4_flex = { git = "https://github.com/PSeitz/lz4_flex", branch = "hc_pr" }
zstd-safe = { version = "7.2.4", default-features = false }
rmcp = { version = "1.5.0", features = ["transport-io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rasn = "0.28.13"
cranelift = { version = "0.131.1", features = ["jit", "module", "native"] }
wgpu = { version = "29.0.1", default-features = false, features = [
    "wgsl",
    "vulkan",
    "vulkan-portability",
    "metal",
] }
winit = { version = "0.31.0-beta.2", default-features = false, features = [
    "x11",
] }
pollster = "0.4.0"
bytemuck = { version = "1.25.0", default-features = false, features = [
    "derive",
] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
glam = { version = "0.32.1", default-features = false, features = [
    "std",
    "bytemuck",
    "fast-math",
] }
rig-core = { version = "0.36.0", default-features = false, features = ["rmcp"] }
twilight-cache-inmemory = "0.17.1"
twilight-gateway = { version = "0.17.1", default-features = false, features = ["twilight-http",  "rustls-platform-verifier", "zlib"] }
twilight-http = { version = "0.17.1", features = ["decompression", "simd-json", "rustls-platform-verifier"], default-features = false }
twilight-model = "0.17.1"
html5ever = "0.29"
markup5ever = "0.14"
selectors = "0.26"
servo_arc = "0.4"
cssparser = "0.34"
webpki-roots = "0.26"
dotenvy = "0.15.7"
uuid = { version = "1.23.1", default-features = false, features = ["v4"] }